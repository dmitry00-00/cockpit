  <title>Физичная ширма — единый проектный лист</title>
  <style>
    :root { color-scheme: dark; background: #18131a; color: #eee3ce; font: 16px/1.4 Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(ellipse at 44% 18%, #41303c 0, #211923 58%, #141117 100%); }
    .intro { max-width: 1200px; margin: 0 auto; padding: 18px 24px 10px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .intro h1 { font: 24px Georgia, serif; margin: 0; color: #f0dfc1; }
    .intro p { margin: 0; color: #c9b89e; font-size: 13px; }
    .stage { width: 100%; overflow-x: auto; padding: 0 8px 24px; }
    svg { display: block; width: min(100%, 1920px); height: auto; margin: 0 auto; background: #201923; border: 1px solid #806342; box-shadow: 0 18px 52px #09080caa; }
    .svg-label { font: 16px Arial, sans-serif; fill: #ded1bc; }
    .svg-small { font: 13px Arial, sans-serif; fill: #bdad96; letter-spacing: .04em; }
    .svg-micro { font: 11px Arial, sans-serif; fill: #a28d75; letter-spacing: .08em; }
    .serif { font-family: Georgia, serif; }
    .title { font: 22px Georgia, serif; fill: #f1e4cf; letter-spacing: .02em; }
    .button { cursor: pointer; }
    .button:focus { outline: none; }
    .button:focus .button-face { stroke: #f6d79a; stroke-width: 3; }
    .button:hover .button-face { fill: #684c45; }
    .hit-target { fill: transparent; pointer-events: all; }
    .mode-button[aria-pressed="true"] .button-face,
    .layer-button[aria-pressed="true"] .button-face { fill: #684f35; stroke: #dab36c; }
    .spine { fill: url(#leather); stroke: #9a734a; stroke-width: 1.5; }
    .card-face { fill: url(#boneCard); stroke: #ba9c6b; stroke-width: 1.3; }
    .hidden { display: none; }
    #partySurface > g > g > text { fill: #49362b; }
    #partySurface > g > g > text[y="31"], #partySurface > g > g > text[y="52"] { fill: #eee3ce; }
    .modal-scrim { fill: #100d12d9; }
    .map-contour { fill: none; stroke: #d5bb84; stroke-opacity: .25; stroke-width: 2; }
    .map-water { fill: #496f76; stroke: #91b1a0; stroke-width: 2; }
    .map-land { fill: url(#land); stroke: #d2b779; stroke-width: 2; }
    .road { fill: none; stroke: #d9c293; stroke-width: 3; stroke-dasharray: 11 6 2 6; }
    .river { fill: none; stroke: #76aaa4; stroke-width: 5; stroke-linecap: round; }
    .map-label { fill: #f1e0bd; font: 14px Georgia, serif; paint-order: stroke; stroke: #29242a; stroke-width: 3px; stroke-linejoin: round; }
    .marker { fill: #eee1bf; stroke: #6f4930; stroke-width: 3; }
    .focus-ring { fill: none; stroke: #e0b366; stroke-width: 3; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>

    (() => {
      const svg = document.querySelector('svg');
      const mapSurface = document.getElementById('mapSurface');
      const partySurface = document.getElementById('partySurface');
      const mapDock = document.getElementById('mapDock');
      const status = document.getElementById('modeStatus');
      const modal = document.getElementById('sheetModal');
      const modalTitle = document.getElementById('sheetTitle');
      const closeButton = document.getElementById('closeSheet');
      let mode = 'map';
      let expanded = false;
      let returnFocus = null;

      function attachButton(el, action) {
        if (!el) return;
        el.addEventListener('click', action);
        el.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            action(event);
          }
        });
      }
      document.querySelectorAll('.timeline-event').forEach(button => attachButton(button, () => {
        status.textContent = button.getAttribute('data-detail');
      }));
      function setMode(next) {
        mode = next;
        mapSurface.classList.toggle('hidden', mode !== 'map');
        mapDock.classList.toggle('hidden', mode !== 'map');
        document.getElementById('cardRow').classList.toggle('hidden', mode === 'party' && expanded);
        partySurface.classList.toggle('hidden', mode !== 'party' || !expanded);
        document.getElementById('mapModeButton').setAttribute('aria-pressed', String(mode === 'map'));
        document.getElementById('partyModeButton').setAttribute('aria-pressed', String(mode === 'party'));
        status.textContent = mode === 'map'
          ? 'КАРТА · КАРТОЧКИ И ЧАСЫ ДОСТУПНЫ'
          : (expanded ? 'ПАРТИЯ · 6 КАРТОЧЕК · ОБЩИЙ КОНТЕКСТ И ЧАСЫ ДОСТУПНЫ' : 'ПАРТИЯ · КОРЕШКИ ВЫБРАННОЙ СТРАНИЦЫ');
        updateExpandLabel();
      }
      function updateExpandLabel() {
        const label = document.getElementById('expandLabel');
        const btn = document.getElementById('expandButton');
        label.textContent = expanded ? 'ВСЕ КАРТОЧКИ · СВЕРНУТЬ' : 'ВСЕ КАРТОЧКИ · РАСКРЫТЬ';
        btn.setAttribute('aria-pressed', String(expanded));
      }
      attachButton(document.getElementById('mapModeButton'), () => setMode('map'));
      attachButton(document.getElementById('partyModeButton'), () => setMode('party'));
      attachButton(document.getElementById('expandButton'), () => {
        if (mode !== 'party') { expanded = true; setMode('party'); }
        else { expanded = !expanded; setMode('party'); }
      });

      document.querySelectorAll('[data-layer-toggle]').forEach(button => {
        attachButton(button, () => {
          const name = button.getAttribute('data-layer-toggle');
          const group = document.getElementById('layer-' + name);
          const enabled = button.getAttribute('aria-pressed') !== 'true';
          button.setAttribute('aria-pressed', String(enabled));
          const dot = button.querySelector('text:last-of-type');
          if (dot) dot.textContent = enabled ? '●' : '○';
          if (group) group.classList.toggle('hidden', !enabled);
        });
      });
      document.querySelectorAll('.scale-button').forEach(button => {
        attachButton(button, () => {
          document.querySelectorAll('.scale-button').forEach(other => {
            const chosen = other === button;
            other.setAttribute('aria-pressed', String(chosen));
            const face = other.querySelector('.button-face');
            face.setAttribute('fill', chosen ? '#614b38' : '#403239');
            face.setAttribute('stroke', chosen ? '#d5b675' : '#735a45');
          });
          status.textContent = 'КАРТА · ВЫБРАН УРОВЕНЬ «' + button.getAttribute('data-scale') + '»';
        });
      });

      function openSheet(name, source) {
        returnFocus = source;
        modalTitle.textContent = 'Полный лист · ' + name;
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
        modal.focus();
        status.textContent = 'ПОЛНЫЙ ЛИСТ · ПАРТИЯ И ЧАСЫ ОСТАЮТСЯ ДОСТУПНЫ';
      }
      function closeSheet() {
        if (modal.classList.contains('hidden')) return;
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        status.textContent = mode === 'map' ? 'КАРТА · КАРТОЧКИ И ЧАСЫ ДОСТУПНЫ' : 'ПАРТИЯ · ОБЩИЙ КОНТЕКСТ И ЧАСЫ ДОСТУПНЫ';
        if (returnFocus) returnFocus.focus();
      }
      document.querySelectorAll('.sheet-open').forEach(button => attachButton(button, () => openSheet(button.getAttribute('data-sheet'), button)));
      attachButton(closeButton, closeSheet);
      modal.addEventListener('click', event => {
        if (event.target === modal.querySelector('.modal-scrim')) closeSheet();
      });
      window.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
          event.stopPropagation();
          closeSheet();
        }
      });
      // Provide a useful initial state with one active scale; all mode/layer controls are ordinary SVG buttons.
      svg.setAttribute('data-mode', mode);
    })();
  </script>
</body>
</html>
