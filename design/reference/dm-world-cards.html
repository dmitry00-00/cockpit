if(S.dest)x.fillText('✖',S.dest[0]*CW+20,S.dest[1]*CW+20);x.strokeStyle='#d4a843';x.lineWidth=3;x.strokeRect(S.party.x*CW+2,S.party.y*CW+2,CW-4,CW-4);x.lineWidth=1;x.fillText('🏹',S.party.x*CW+20,S.party.y*CW+20)}
function wclk(ev){const[a,b]=cell(ev,$('wc'),GW,GH),p=Object.keys(E).find(k=>E[k].at&&E[k].at[0]==a&&E[k].at[1]==b);if(p)return op(p);if(TER[b*GW+a]=='w')return;S.dest=[a,b];dw()}
function whv(ev){const[a,b]=cell(ev,$('wc'),GW,GH),i=b*GW+a,o=OWN[S.era][i];$('st').textContent=(TN[TER[i]]||'')+(o?' · '+E[o].n:'')+' · 24 мили/клетка'}
function day(){const p=S.party;S.acc+=S.pace/24;while(S.acc>=1){S.acc--;const d=S.dest;if(!d||(d[0]==p.x&&d[1]==p.y))break;const dx=Math.sign(d[0]-p.x),dy=Math.sign(d[1]-p.y);let nx=p.x+dx,ny=p.y+dy;if(TER[ny*GW+nx]=='w'){if(dx&&TER[p.y*GW+nx]!='w')ny=p.y;else if(dy&&TER[ny*GW+p.x]!='w')nx=p.x;else{S.acc=0;break}}p.x=nx;p.y=ny}S.day++;S.rat=Math.max(0,S.rat-4);dw();rp();rb()}
function rp(){const el=$('pp');if(!el)return;el.innerHTML=['bo','korrin','lyra','aldric'].map(id=>{const e=E[id],[v,m,c]=e.b.HP;return`<div class="pc" onclick="op('${id}')"><span>${e.i}</span><b>${e.n.split(' ')[0]}</b><div class="tr"><u style="width:${100*v/m}%;background:${c}"></u></div></div>`}).join('')+`<span>🍖 ${S.rat}</span>`+[18,24,30].map(v=>`<button class="bt${S.pace==v?' on':''}" onclick="S.pace=${v};rp()">${v==18?'🐢':v==24?'🚶':'🏃'} ${v}</button>`).join('')+'<button class="bt" onclick="day()">▶ день</button>'}
function rr(){const ids=['nw','wd','cor','zhent'],cnt=OWN.map(o=>ids.map(id=>o.filter(v=>v==id).length)),mx=Math.max(...cnt.map(a=>a.reduce((s,v)=>s+v,0)));$('rbn').innerHTML=ERAS.map((er,i)=>`<div class="rc${S.era==i?' on':''}" onclick="S.era=${i};dw();rr();rb()"><div class="sg">${ids.map((id,j)=>`<s style="height:${46*cnt[i][j]/mx}px;background:${RC[id]}"></s>`).join('')}</div>${er.y}</div>`).join('')+`<div class="lg">${ids.map(chip).join('')}<br>${ERAS[S.era].y} — ${ERAS[S.era].n}</div>`}
function bdn(ev){const[a,b]=cell(ev,$('bc'),TW,TH),t=TK.find(k=>k.x==a&&k.y==b);S.sel=t?t.k:null;S.drag=t?t.k:null;db();bi()}
function bmv(ev){const[a,b]=cell(ev,$('bc'),TW,TH);S.hv=[a,b];if(S.drag){const t=TK.find(k=>k.k==S.drag);if(!TK.some(k=>k!=t&&k.x==a&&k.y==b)&&!WL.has(a+','+b)){t.x=a;t.y=b}}db()}
function db(){const c=$('bc');if(!c)return;const x=c.getContext('2d'),C=36;x.clearRect(0,0,576,360);
for(let j=0;j<TH;j++)for(let i=0;i<TW;i++){const k=i+','+j;x.fillStyle=WL.has(k)?'#5a4630':(i+j)%2?'#2a2030':'#241a2c';x.fillRect(i*C,j*C,C,C);if(DF.has(k)){x.fillStyle='rgba(212,168,67,.2)';x.fillRect(i*C,j*C,C,C)}}
x.font='20px serif';x.textAlign='center';x.textBaseline='middle';
TK.forEach(t=>{if(S.fog&&!t.p&&!TK.some(q=>q.p&&Math.hypot(q.x-t.x,q.y-t.y)<=5.5))return;x.fillStyle=t.p?'rgba(212,168,67,.25)':'rgba(192,57,43,.3)';x.fillRect(t.x*C+1,t.y*C+1,C-2,C-2);if(S.sel==t.k){x.strokeStyle='#fff';x.strokeRect(t.x*C+2,t.y*C+2,C-4,C-4)}x.globalAlpha=t.h?1:.3;x.fillText(t.i,t.x*C+18,t.y*C+16);x.globalAlpha=1;x.fillStyle=t.h/t.m>.5?'#4a2':t.h/t.m>.25?'#ca2':'#c33';x.fillRect(t.x*C+3,t.y*C+C-7,(C-6)*t.h/t.m,4)});
const s=TK.find(k=>k.k==S.sel);if(s&&S.hv){x.strokeStyle='#d4a843';x.beginPath();x.moveTo(s.x*C+18,s.y*C+18);x.lineTo(S.hv[0]*C+18,S.hv[1]*C+18);x.stroke();x.fillStyle='#d4a843';x.font='10px monospace';x.fillText(5*Math.max(Math.abs(S.hv[0]-s.x),Math.abs(S.hv[1]-s.y))+' ft',S.hv[0]*C+18,S.hv[1]*C-4)}
const f=$('bf').getContext('2d');f.globalCompositeOperation='source-over';f.clearRect(0,0,576,360);if(S.fog){f.fillStyle='rgba(8,4,12,.9)';f.fillRect(0,0,576,360);f.globalCompositeOperation='destination-out';TK.filter(t=>t.p).forEach(t=>{const g=f.createRadialGradient(t.x*C+18,t.y*C+18,C*3,t.x*C+18,t.y*C+18,C*5.5);g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');f.fillStyle=g;f.beginPath();f.arc(t.x*C+18,t.y*C+18,C*5.5,0,7);f.fill()})}}
function bi(){const el=$('bi');if(!el)return;const o=[...TK].sort((a,b)=>b.in-a.in),cur=o[S.turn%o.length],s=TK.find(k=>k.k==S.sel);
el.innerHTML=`<div class="ib">${o.map(t=>`<div class="ic${t==cur?' cur':''}${t.h?'':' dead'}" onclick="S.sel='${t.k}';db();bi()">${t.i}<b>${t.in}</b><div class="tr"><u style="width:${100*t.h/t.m}%;background:${t.p?'#4a2':'#c33'}"></u></div></div>`).join('')}</div><div class="pp"><button class="bt" onclick="S.turn++;bi()">⏭ R${Math.floor(S.turn/o.length)+1}</button><button class="bt${S.fog?' on':''}" onclick="S.fog=!S.fog;db();bi()">🌫</button>${s?`<span>${s.i} ${s.n} ${s.h}/${s.m}</span>`+[-5,-1,1,5].map(d=>`<button class="bt" onclick="hp(${d})">${d>0?'+':''}${d}</button>`).join('')+`<button class="bt" onclick="op('${s.e}')">🗂</button>`:'<span>клик — выбор · тяни — перемещение</span>'}</div>`}
function hp(d){const t=TK.find(k=>k.k==S.sel);if(!t)return;t.h=Math.max(0,Math.min(t.m,t.h+d));if(t.p)E[t.e].b.HP[0]=t.h;db();bi();rd()}
function fr(id){const e=E[id],[ic,tn,c]=T[e.t];return`<div class="fl" style="--c:${c}" onclick="op('${id}')"><span class="ft">${e.i}</span><span class="fn"><b>${e.n}</b><i>${ic} ${tn} · ${e.sub}</i></span><span class="kv">🔗 ${(JSON.stringify(e.tabs).match(/@\w+/g)||[]).length}</span></div>`}
function rl(){const q=S.q.toLowerCase();$('fl').innerHTML=Object.keys(E).filter(id=>(!S.ft||E[id].t==S.ft)&&(E[id].n+E[id].sub).toLowerCase().includes(q)).map(fr).join('')||'<p class="em">—</p>'}
function rm(){const m=$('main');
if(S.scr=='world'){m.innerHTML='<canvas id="wc" width="560" height="320" onclick="wclk(event)" onmousemove="whv(event)"></canvas><div id="st" class="st">клик — цель маршрута · пины — карточки</div><div class="rbn" id="rbn"></div><div class="pp" id="pp"></div>';dw();rr();rp()}
else if(S.scr=='battle'){m.innerHTML='<div id="bw"><canvas id="bc" width="576" height="360" onpointerdown="bdn(event)" onpointermove="bmv(event)" onpointerup="S.drag=null"></canvas><canvas id="bf" width="576" height="360"></canvas></div><div id="bi"></div>';db();bi()}
else{m.innerHTML=`<input class="in" placeholder="🔍" value="${S.q}" oninput="S.q=this.value;rl()"><div class="fs">${Object.entries(T).map(([k,[ic,n,c]])=>`<a class="ch${S.ft==k?' on':''}" style="--c:${c}" onclick="S.ft=S.ft=='${k}'?0:'${k}';rm()">${ic} ${n}</a>`).join('')}</div><div id="fl"></div>`;rl()}}
function go(s){S.scr=s;location.hash=s;ren()}
function ren(){$('rail').innerHTML=[['world','🌍'],['battle','⚔'],['book','📚']].map(([s,i])=>`<button class="${S.scr==s?'on':''}" onclick="go('${s}')">${i}</button>`).join('');rb();rm();rd()}
onhashchange=()=>{const h=location.hash.slice(1);if(['world','battle','book'].includes(h)&&h!=S.scr){S.scr=h;ren()}};
{const h=location.hash.slice(1);if(['world','battle','book'].includes(h))S.scr=h}ren();
</script></body></html>
