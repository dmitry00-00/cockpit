<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img">
<title>БА17 — лист 2, подвижные детали</title>
<desc>Лист A4 в масштабе 1:1. Вырезать два указателя и четыре бумажные шайбы; собрать на разрезных канцелярских заклёпках.</desc>
<style>text{font-family:Georgia,"Times New Roman",serif}.cut{stroke:#8c6337;stroke-dasharray:1.5 1.2}.hole{fill:#fffdf7;stroke:#8c6337;stroke-width:.35}.tiny{font-size:2.8px}</style>
<rect x="0" y="0" width="210" height="297" fill="#fbf8f0"/>
<text x="10.00" y="15.00" text-anchor="start" font-size="6.00" fill="#4d3548" font-weight="bold" >БА17 · ЛИСТ 2 ИЗ 2 · ПОДВИЖНЫЕ ДЕТАЛИ</text>
<text x="10.00" y="22.00" text-anchor="start" font-size="3.25" fill="#71685c" font-weight="normal" >Печать A4, масштаб 100%. Контурная линия — рез. Круг в центре указателя — отверстие Ø3 мм.</text>
<text x="54.00" y="33.00" text-anchor="middle" font-size="3.80" fill="#4d3548" font-weight="bold" >УКАЗАТЕЛЬ МЕСЯЦА</text>
<text x="54.00" y="39.00" text-anchor="middle" font-size="3.00" fill="#71685c" font-weight="normal" >длина 32 мм</text>
<polygon points="54.00,59.00 56.86,64.50 55.77,64.50 55.77,87.30 58.94,89.80 57.74,92.40 50.26,92.40 49.06,89.80 52.23,87.30 52.23,64.50 51.14,64.50" fill="#8c6337" stroke="#302820" stroke-width=".35"/><circle cx="54.00" cy="91.00" r="1.50" stroke="#302820" stroke-width="0.35" fill="#fbf8f0" class="hole"/>
<text x="132.00" y="33.00" text-anchor="middle" font-size="3.80" fill="#4d3548" font-weight="bold" >ЧАСОВАЯ СТРЕЛКА</text>
<text x="132.00" y="39.00" text-anchor="middle" font-size="3.00" fill="#71685c" font-weight="normal" >длина 23 мм</text>
<polygon points="132.00,68.00 134.59,73.50 133.60,73.50 133.60,87.30 136.47,89.80 135.38,92.40 128.62,92.40 127.53,89.80 130.40,87.30 130.40,73.50 129.41,73.50" fill="#a9783e" stroke="#302820" stroke-width=".35"/><circle cx="132.00" cy="91.00" r="1.50" stroke="#302820" stroke-width="0.35" fill="#fbf8f0" class="hole"/>
<text x="54.00" y="101.00" text-anchor="middle" font-size="2.90" fill="#71685c" font-weight="normal" >Вырезать по контуру</text>
<text x="132.00" y="101.00" text-anchor="middle" font-size="2.90" fill="#71685c" font-weight="normal" >Вырезать по контуру</text>
<text x="10.00" y="121.00" text-anchor="start" font-size="3.80" fill="#4d3548" font-weight="bold" >БУМАЖНЫЕ ШАЙБЫ · 4 ШТ.</text>
<circle cx="21.00" cy="137.00" r="5.00" stroke="#8c6337" stroke-width="0.40" fill="none"/>
<circle cx="21.00" cy="137.00" r="1.50" stroke="#302820" stroke-width="0.35" fill="#fbf8f0" class="hole"/>
<text x="21.00" y="146.00" text-anchor="middle" font-size="2.60" fill="#71685c" font-weight="normal" >1</text>
<circle cx="45.00" cy="137.00" r="5.00" stroke="#8c6337" stroke-width="0.40" fill="none"/>
<circle cx="45.00" cy="137.00" r="1.50" stroke="#302820" stroke-width="0.35" fill="#fbf8f0" class="hole"/>
<text x="45.00" y="146.00" text-anchor="middle" font-size="2.60" fill="#71685c" font-weight="normal" >2</text>
<circle cx="69.00" cy="137.00" r="5.00" stroke="#8c6337" stroke-width="0.40" fill="none"/>
<circle cx="69.00" cy="137.00" r="1.50" stroke="#302820" stroke-width="0.35" fill="#fbf8f0" class="hole"/>
<text x="69.00" y="146.00" text-anchor="middle" font-size="2.60" fill="#71685c" font-weight="normal" >3</text>
<circle cx="93.00" cy="137.00" r="5.00" stroke="#8c6337" stroke-width="0.40" fill="none"/>
<circle cx="93.00" cy="137.00" r="1.50" stroke="#302820" stroke-width="0.35" fill="#fbf8f0" class="hole"/>
<text x="93.00" y="146.00" text-anchor="middle" font-size="2.60" fill="#71685c" font-weight="normal" >4</text>
<text x="10.00" y="166.00" text-anchor="start" font-size="4.00" fill="#4d3548" font-weight="bold" >СБОРКА</text>
<text x="10.00" y="174.00" text-anchor="start" font-size="3.15" fill="#302820" font-weight="normal" >1. Напечатайте оба листа на плотной бумаге; квадрат должен быть 50 ± 1 мм.</text>
<text x="10.00" y="181.00" text-anchor="start" font-size="3.15" fill="#302820" font-weight="normal" >2. Лист 1 наклейте на переплётный картон 1–2 мм и вырежьте панель 190 × 145 мм.</text>
<text x="10.00" y="188.00" text-anchor="start" font-size="3.15" fill="#302820" font-weight="normal" >3. Пробейте два отверстия Ø3 мм по центрам циферблатов; вырежьте стрелки и шайбы.</text>
<text x="10.00" y="195.00" text-anchor="start" font-size="3.15" fill="#302820" font-weight="normal" >4. На каждой оси: шайба → стрелка → шайба → разрезная заклёпка; оставьте ход свободным.</text>
<text x="10.00" y="202.00" text-anchor="start" font-size="3.15" fill="#302820" font-weight="normal" >5. Подклейте снизу четыре противоскользящие точки Ø8 мм; при желании заламинируйте матово.</text>
<text x="10.00" y="213.00" text-anchor="start" font-size="3.00" fill="#71685c" font-weight="normal" >Проверка: указатель месяца удерживается в секторе; часы проходят 00–23; основание не уезжает при</text>
<text x="10.00" y="219.00" text-anchor="start" font-size="3.00" fill="#71685c" font-weight="normal" >20 поворотах одной рукой (допуск сдвига до 5 мм). Физическую сборку и устойчивость ещё нужно измерить.</text>
<rect x="145.00" y="229.00" width="50.00" height="50.00" stroke="#8c6337" stroke-width="0.55" fill="none"/>
<text x="170.00" y="286.00" text-anchor="middle" font-size="3.10" fill="#4d3548" font-weight="bold" >КОНТРОЛЬ 50 × 50 мм</text>
</svg>