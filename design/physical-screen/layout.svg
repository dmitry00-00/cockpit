<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Условный физический чертёж ширмы-картографического пюпитра</title>
  <desc id="desc">Фронтальный вид и разрез корпуса с центральным сменным планшетом, шестью карточками, боковыми карманами и нижней полкой. Размеры являются предположением прототипа, не производственной спецификацией.</desc>
  <defs>
    <linearGradient id="leather" x2="0" y2="1"><stop stop-color="#49303a"/><stop offset=".55" stop-color="#30232b"/><stop offset="1" stop-color="#241b22"/></linearGradient>
    <linearGradient id="bronze" x2="0" y2="1"><stop stop-color="#e2c187"/><stop offset=".3" stop-color="#a9783e"/><stop offset=".7" stop-color="#76502f"/><stop offset="1" stop-color="#d1a766"/></linearGradient>
    <linearGradient id="bone" x2="0" y2="1"><stop stop-color="#f0e4c9"/><stop offset="1" stop-color="#cbb997"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#40545a"/><stop offset=".5" stop-color="#26363a"/><stop offset="1" stop-color="#172529"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#09080b" flood-opacity=".55"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 9 4 0 8" fill="none" stroke="#d6b77f" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Georgia,'Times New Roman',serif;fill:#eadfc7} .small{font-size:15px;letter-spacing:.04em}.label{font-size:18px}.title{font-size:30px;letter-spacing:.08em}.muted{fill:#b9a98d}.gold{fill:#e3bf7c}.rule{stroke:#a9783e;stroke-width:2;fill:none}.leader{stroke:#d6b77f;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.fine{stroke:#6c5947;stroke-width:1;fill:none}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#17151a"/>
  <path d="M48 84H1552" stroke="#76502f" stroke-width="2"/>
  <text x="56" y="53" class="title">ШИРМА · КАРТОГРАФИЧЕСКИЙ ПЮПИТР</text>
  <text x="1544" y="52" text-anchor="end" class="small gold">КОНЦЕПТ · НЕ ПРОИЗВОДСТВЕННЫЙ ЧЕРТЁЖ</text>

  <!-- frontal elevation -->
  <g filter="url(#shadow)">
    <rect x="194" y="145" width="1136" height="630" rx="16" fill="url(#leather)" stroke="url(#bronze)" stroke-width="9"/>
    <rect x="207" y="158" width="1110" height="604" rx="10" fill="none" stroke="#d0ad72" stroke-width="1.5" opacity=".6"/>
    <!-- left wing -->
    <rect x="213" y="176" width="184" height="565" rx="8" fill="#34262d" stroke="#8f6539" stroke-width="3"/>
    <text x="305" y="204" text-anchor="middle" class="small gold">ЛЕВАЯ СТВОРКА</text>
    <g>
      <path d="M230 222h150v89q-75 18-150 0z" fill="#60434a" stroke="#ac814d" stroke-width="2"/><text x="305" y="255" text-anchor="middle" class="label">NPC</text><text x="305" y="279" text-anchor="middle" class="small muted">карман колоды</text>
      <path d="M230 321h150v89q-75 18-150 0z" fill="#493740" stroke="#ac814d" stroke-width="2"/><text x="305" y="354" text-anchor="middle" class="label">Противники</text><text x="305" y="378" text-anchor="middle" class="small muted">карман колоды</text>
      <path d="M230 420h150v89q-75 18-150 0z" fill="#554039" stroke="#ac814d" stroke-width="2"/><text x="305" y="453" text-anchor="middle" class="label">Предметы</text><text x="305" y="477" text-anchor="middle" class="small muted">карман колоды</text>
      <path d="M230 519h150v76q-75 18-150 0z" fill="#514534" stroke="#ac814d" stroke-width="2"/><text x="305" y="551" text-anchor="middle" class="label">Умения</text><text x="305" y="575" text-anchor="middle" class="small muted">карман колоды</text>
      <rect x="230" y="610" width="150" height="54" rx="4" fill="#242125" stroke="#b78348" stroke-width="2"/><path d="M240 631h130M240 643h130" stroke="#d5b775" stroke-width="2"/><text x="305" y="686" text-anchor="middle" class="small">инициатива</text>
      <rect x="230" y="696" width="150" height="30" rx="3" fill="#e0d1ae"/><path d="M244 705h48m-48 8h90" stroke="#74604c" stroke-width="2"/><text x="310" y="719" text-anchor="middle" font-size="12" fill="#493a32">входящие записки</text>
    </g>
    <!-- central tablet bezel -->
    <rect x="418" y="176" width="700" height="450" rx="12" fill="#151316" stroke="url(#bronze)" stroke-width="6"/>
    <!-- spines: six, card-edge itself -->
    <g>
      <rect x="437" y="190" width="106" height="55" rx="3" fill="url(#bone)" stroke="#a67a43"/><rect x="549" y="190" width="106" height="55" rx="3" fill="#d9c7a2" stroke="#a67a43"/><rect x="661" y="190" width="106" height="55" rx="3" fill="url(#bone)" stroke="#a67a43"/><rect x="773" y="190" width="106" height="55" rx="3" fill="#d9c7a2" stroke="#a67a43"/><rect x="885" y="190" width="106" height="55" rx="3" fill="url(#bone)" stroke="#a67a43"/><rect x="997" y="190" width="101" height="55" rx="3" fill="#d9c7a2" stroke="#a67a43"/>
      <g font-size="12" text-anchor="middle" fill="#48372e"><text x="490" y="213">корешок 1</text><text x="490" y="231" fill="#48372e">карта</text><text x="602" y="213" fill="#48372e">корешок 2</text><text x="602" y="231" fill="#48372e">карта</text><text x="714" y="213" fill="#48372e">корешок 3</text><text x="714" y="231" fill="#48372e">карта</text><text x="826" y="213" fill="#48372e">корешок 4</text><text x="826" y="231" fill="#48372e">карта</text><text x="938" y="213" fill="#48372e">корешок 5</text><text x="938" y="231" fill="#48372e">карта</text><text x="1047" y="213" fill="#48372e">корешок 6</text><text x="1047" y="231" fill="#48372e">карта</text></g>
    </g>
    <!-- replaceable surface -->
    <rect x="436" y="254" width="664" height="355" rx="5" fill="url(#glass)" stroke="#9b784d" stroke-width="2"/>
    <path d="M460 536q100-150 203-68t168-48 229 42" stroke="#c6a978" stroke-width="3" fill="none" opacity=".75"/>
    <path d="M475 316q85 38 144 4t121 26 147-13 161 35" stroke="#759285" stroke-width="2" fill="none" opacity=".7"/>
    <circle cx="750" cy="433" r="52" fill="#2e403c" stroke="#b28c55" stroke-width="2"/><path d="M750 385v96M702 433h96" stroke="#d9bd83" stroke-width="2"/><circle cx="750" cy="433" r="4" fill="#eddaaa"/>
    <text x="768" y="593" text-anchor="middle" class="small muted">СМЕННЫЙ ПЛАНШЕТ · КАРТА ↔ ПАРТИЯ</text>
    <!-- right scale/tool rail -->
    <rect x="1128" y="176" width="64" height="450" rx="4" fill="#50392f" stroke="#c09050" stroke-width="3"/>
    <text x="1160" y="202" text-anchor="middle" font-size="13" class="gold">МАСШТАБ</text>
    <g font-size="14" text-anchor="middle"><rect x="1137" y="218" width="46" height="41" fill="#d7c7a6"/><text x="1160" y="244" fill="#392b2a">Мир</text><rect x="1137" y="266" width="46" height="41" fill="#493640" stroke="#a87943"/><text x="1160" y="292">Регион</text><rect x="1137" y="314" width="46" height="41" fill="#493640" stroke="#a87943"/><text x="1160" y="340">Лок.</text><path d="M1142 375h36m-36 14h36m-36 14h36m-36 14h36" stroke="#d8bc84" stroke-width="3"/><text x="1160" y="453" class="small">инстр.</text><rect x="1137" y="466" width="46" height="38" fill="#342b2b" stroke="#a87943"/><text x="1160" y="490">слои</text><rect x="1137" y="511" width="46" height="38" fill="#342b2b" stroke="#a87943"/><text x="1160" y="535">поиск</text><rect x="1137" y="556" width="46" height="38" fill="#342b2b" stroke="#a87943"/><text x="1160" y="580">+ поле</text></g>
    <!-- right wing books -->
    <rect x="1204" y="176" width="109" height="565" rx="8" fill="#34262d" stroke="#8f6539" stroke-width="3"/>
    <text x="1258" y="204" text-anchor="middle" class="small gold">ПРАВАЯ СТВОРКА</text>
    <path d="M1218 226h81v170q-40 16-81 0z" fill="#543a3e" stroke="#c09452" stroke-width="2"/><path d="M1228 236v144m8-144v144" stroke="#dfc89a" stroke-width="2"/><text x="1266" y="290" text-anchor="middle" class="label">Журнал</text><text x="1266" y="320" text-anchor="middle" class="small muted">книга</text>
    <path d="M1218 416h81v170q-40 16-81 0z" fill="#40363a" stroke="#c09452" stroke-width="2"/><path d="M1228 426v144m8-144v144" stroke="#dfc89a" stroke-width="2"/><text x="1266" y="480" text-anchor="middle" class="label">Летопись</text><text x="1266" y="510" text-anchor="middle" class="small muted">книга</text>
    <rect x="1218" y="608" width="81" height="114" fill="#282328" stroke="#8f6539"/><text x="1258" y="651" text-anchor="middle" class="small">вкладки</text><path d="M1230 667h55m-55 12h40m-40 12h48" stroke="#a89173" stroke-width="2"/>
    <!-- shared lower shelf -->
    <rect x="418" y="641" width="774" height="100" rx="7" fill="#382a2e" stroke="url(#bronze)" stroke-width="4"/>
    <text x="440" y="667" class="small gold">ОБЩИЙ ПОХОД / ЛАГЕРЬ</text>
    <path d="M438 680h350" stroke="#8c6941"/>
    <g class="small"><text x="442" y="704">Путь</text><rect x="489" y="687" width="80" height="25" fill="#e0d1ae"/><text x="529" y="705" text-anchor="middle" font-size="13" fill="#30232b">сводка</text><text x="586" y="704">Запасы</text><rect x="642" y="687" width="76" height="25" fill="#e0d1ae"/><text x="680" y="705" text-anchor="middle" font-size="13" fill="#30232b">числа</text><text x="728" y="704">Лагерь</text><rect x="778" y="687" width="65" height="25" fill="#e0d1ae"/><text x="810" y="705" text-anchor="middle" font-size="13" fill="#30232b">состав</text></g>
    <circle cx="915" cy="691" r="35" fill="#242529" stroke="url(#bronze)" stroke-width="5"/><circle cx="915" cy="691" r="25" fill="none" stroke="#ddc388"/><path d="M915 667v48m-24-24h48M898 674l34 34m0-34-34 34" stroke="#d9bd83" stroke-width="2"/><circle cx="915" cy="691" r="4" fill="#eee0be"/>
    <text x="962" y="683" class="small">Время</text><text x="962" y="707" class="label gold">День · Часы · Темп</text><text x="962" y="730" class="small muted">астролябия закреплена справа</text>
  </g>

  <!-- dimensions as assumptions -->
  <path d="M194 812v29m1136-29v29M194 829h1136" class="rule" marker-end="url(#arrow)"/>
  <text x="762" y="861" text-anchor="middle" class="label gold">≈ 1 200 мм — ПРЕДПОЛОЖЕНИЕ ПРОТОТИПА</text>
  <path d="M150 145h-30m30 630h-30M133 145v630" class="rule" marker-end="url(#arrow)"/>
  <text x="105" y="462" text-anchor="middle" transform="rotate(-90 105 462)" class="label gold">≈ 720 мм · предположение</text>

  <!-- Chronology cassette: paper strip on two rollers -->
  <g aria-label="11 — хронологическая лента на роликах">
    <rect x="418" y="746" width="774" height="26" rx="4" fill="#34262d" stroke="#c09050"/>
    <rect x="423" y="749" width="10" height="20" rx="4" fill="url(#bronze)"/>
    <rect x="1177" y="749" width="10" height="20" rx="4" fill="url(#bronze)"/>
    <path d="M440 759H1170" stroke="#d9c7a2"/>
    <path d="M810 748V770" stroke="#e3bf7c" stroke-width="3"/>
    <text x="450" y="755" font-size="10">11 · ХРОНОЛОГИЯ · КАНОН / КАМПАНИЯ / ПРЕДЛОЖЕНИЯ</text>
    <text x="825" y="768" font-size="10">указатель «сейчас»</text>
  </g>

  <!-- section inset -->
  <g transform="translate(1380 155)">
    <text x="0" y="0" class="label gold">РАЗРЕЗ · УСЛОВНО</text>
    <text x="0" y="28" class="small muted">без расчёта нагрузок</text>
    <path d="M26 90h146v22H26z" fill="url(#glass)" stroke="#c59b5e" stroke-width="2"/>
    <path d="M26 116h146v18H26z" fill="url(#bone)" stroke="#a87943"/>
    <path d="M26 138h146v64H26z" fill="url(#leather)" stroke="#a87943"/>
    <path d="M42 202l-18 75h36l18-75" fill="#55413c" stroke="#bd9053" stroke-width="2"/>
    <path d="M154 202l19 75h-36l-18-75" fill="#55413c" stroke="#bd9053" stroke-width="2"/>
    <text x="0" y="310" class="small">1 · матовая лицевая</text><text x="0" y="334" class="small">2 · защитный слой</text><text x="0" y="358" class="small">3 · каркас створки</text><text x="0" y="382" class="small">4 · сервисное гнездо</text>
    <path d="M178 102h24m-24 25h24m-24 44h24" class="fine"/>
  </g>

  <!-- callouts -->
  <g>
    <circle cx="448" cy="267" r="15" fill="#9f713c" stroke="#f0d69b"/><text x="448" y="273" text-anchor="middle" font-size="16">1</text>
    <circle cx="475" cy="192" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="475" y="198" text-anchor="middle" font-size="15">2</text>
    <circle cx="1160" cy="367" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="1160" y="373" text-anchor="middle" font-size="15">3</text>
    <circle cx="1160" cy="467" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="1160" y="473" text-anchor="middle" font-size="15">4</text>
    <circle cx="555" cy="690" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="555" y="696" text-anchor="middle" font-size="15">5</text>
    <circle cx="915" cy="691" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="915" y="697" text-anchor="middle" font-size="15">6</text>
    <circle cx="249" cy="237" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="249" y="243" text-anchor="middle" font-size="15">7</text>
    <circle cx="249" cy="614" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="249" y="620" text-anchor="middle" font-size="15">8</text>
    <circle cx="1236" cy="248" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="1236" y="254" text-anchor="middle" font-size="15">9</text>
    <circle cx="249" cy="697" r="14" fill="#9f713c" stroke="#f0d69b"/><text x="249" y="703" text-anchor="middle" font-size="15">10</text>
  </g>
  <path d="M48 914H1552" stroke="#76502f" stroke-width="2"/>
  <text x="56" y="949" class="small muted">Материалы и размеры условны. Петли, теплоотвод, опоры, эргономика и допуски требуют отдельной инженерной проверки.</text>
  <text x="1544" y="949" text-anchor="end" class="small gold">СВЕТ СВЕРХУ-СЛЕВА · ПЛОСКИЕ СЛОИ, ОБЪЁМ ТОЛЬКО У ПРИБОРОВ</text>
</svg>
